name: Build APK depuis le ZIP

# Decompresse le .zip place a la racine du depot, puis compile l'APK Android.
# A placer dans :  .github/workflows/build-from-zip.yml
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Decompresser le ZIP et localiser le projet
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier .zip trouve a la racine du depot."
            exit 1
          fi
          echo "Archive trouvee : $ZIP"
          rm -rf _extracted
          unzip -o "$ZIP" -d _extracted > /dev/null
          PKG=$(find _extracted -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json introuvable dans l'archive."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG")
          echo "Projet detecte : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dependances
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Compiler l'app web (Vite)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Ajouter la plateforme Android (Capacitor)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Synchroniser Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Rendre gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: glb2sprites-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
